<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Data Pirates</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>🏴‍☠️ Data Pirates</h1>

        <h2>Create Account</h2>

        <form id="userRegisterForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <div style="position:relative;">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                    style="width:100%;">
                <span onclick="togglePassword('password', this)" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer;">👁️</span>
            </div>

            <button type="submit">

                Sign Up

            </button>

        </form>

        <p id="message"></p>

        <p>Already have an account? <a href="account-login.html">Sign in</a></p>

        <p><a href="index.html">⬅ Back to Home</a></p>

    </div>

</div>

<script src="js/account.js"></script>

</body>

</html>
