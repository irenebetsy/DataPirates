<div class="page-header">

    <h1>📝 Blog Management</h1>

    <button id="openBlogForm" class="primary-btn">
        + New Blog
    </button>

</div>

<table class="admin-table">

    <thead>

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>Date</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody id="blogRows">

    </tbody>

</table>

<!-- BLOG MODAL -->

<div id="blogModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">&times;</span>

        <h2 id="modalTitle">Create Blog</h2>

        <form id="blogForm">

            <input
                id="title"
                type="text"
                placeholder="Title"
                required>

            <textarea
                id="description"
                placeholder="Description"></textarea>

            <textarea
                id="blogContent"
                rows="10"
                placeholder="Content"></textarea>

            <input
                id="imageURL"
                type="text"
                placeholder="Image URL (e.g. assets/blogs/myimage.jpg)">

            <button
                type="submit"
                id="submitBtn">

                Publish Blog

            </button>

        </form>

    </div>

</div>
