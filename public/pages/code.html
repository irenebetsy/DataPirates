<div class="page-header">

    <h1>💻 Code Library</h1>

    <button id="openCodeForm" class="primary-btn">
        + New Snippet
    </button>

</div>

<table class="admin-table">

    <thead>

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>Language</th>
            <th>Actions</th>

        </tr>

    </thead>

    <tbody id="codeRows">

    </tbody>

</table>

<!-- CODE MODAL -->

<div id="codeModal" class="modal">

    <div class="modal-content">

        <span id="closeCodeModal">&times;</span>

        <h2 id="codeModalTitle">Add Code Snippet</h2>

        <form id="codeForm">

            <input
                id="codeTitle"
                type="text"
                placeholder="Snippet Title"
                required>

            <textarea
                id="codeDescription"
                placeholder="Description"></textarea>

            <input
                id="codeLanguage"
                type="text"
                placeholder="Language (Python, SQL, Power BI...)">

            <textarea
                id="codeContent"
                rows="10"
                placeholder="Paste your code here"></textarea>

            <input
                id="codeGithubURL"
                type="text"
                placeholder="GitHub URL (optional)">

            <button
                type="submit"
                id="codeSubmitBtn">

                Save Snippet

            </button>

        </form>

    </div>

</div>
